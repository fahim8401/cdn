name: Build and Test CDN Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cachenet-enterprise

jobs:
  build-and-test:
    name: Build and Test All Components
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          admin/package-lock.json
          client/package-lock.json
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
        
    - name: Make build script executable
      run: chmod +x build.sh
      
    - name: Check system requirements
      run: ./build.sh check
      
    - name: Install dependencies
      run: ./build.sh install
      
    - name: Build all components
      run: ./build.sh build
      
    - name: Run linting
      run: ./build.sh lint
      
    - name: Run tests
      run: ./build.sh test
      
    - name: Upload admin build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: admin-build
        path: admin/dist/
        retention-days: 7
        
    - name: Upload client build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: client-build
        path: client/dist/
        retention-days: 7

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    strategy:
      matrix:
        component: [api, admin, client]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push ${{ matrix.component }} image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.component }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install validation tools
      run: |
        pip install ansible yamllint jinja2
        
    - name: Validate YAML files
      run: |
        yamllint prometheus/prometheus.yml || true
        yamllint prometheus/rules.yml || true
        yamllint loki/loki.yaml || true
        find ansible -name "*.yml" -exec yamllint {} \; || true
        
    - name: Validate Ansible playbooks
      run: |
        ansible-lint ansible/playbooks/ || true
        find ansible/playbooks -name "*.yml" -exec ansible-playbook --syntax-check {} \; || true
        
    - name: Validate Docker Compose
      run: |
        docker compose config > /dev/null

  test-docker-compose:
    name: Test Docker Compose Setup
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create .env file
      run: cp .env.example .env
      
    - name: Test Docker Compose configuration
      run: docker compose config > /dev/null
      
    - name: Start core services
      run: |
        docker compose up -d db redis
        sleep 10
        
    - name: Check service health
      run: |
        docker compose ps
        docker compose logs db
        docker compose logs redis
        
    - name: Cleanup
      run: docker compose down -v

  notify-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, build-docker-images, validate-configs, test-docker-compose]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.build-and-test.result == 'success' && needs.security-scan.result == 'success'
      run: |
        echo "✅ Build completed successfully"
        
    - name: Notify on failure
      if: needs.build-and-test.result == 'failure' || needs.security-scan.result == 'failure'
      run: |
        echo "❌ Build failed"
        exit 1