name: Deploy Cachenet CDN Configurations

on:
  push:
    branches: [ main ]
    paths:
      - 'nginx/**'
      - 'ansible/**'
      - 'prometheus/**'
      - 'grafana/**'
      - 'api/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: cachenet-enterprise

jobs:
  validate:
    name: Validate Configurations
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install ansible yamllint jinja2 requests
        
    - name: Validate YAML files
      run: |
        yamllint prometheus/prometheus.yml
        yamllint prometheus/rules.yml
        yamllint loki/loki.yaml
        yamllint ansible/playbooks/*.yml
        
    - name: Validate Ansible playbooks
      run: |
        ansible-lint ansible/playbooks/ || true
        ansible-playbook --syntax-check ansible/playbooks/*.yml
        
    - name: Validate Nginx configuration
      run: |
        # Test nginx config syntax (would need nginx installed)
        echo "Nginx configuration validation placeholder"
        
    - name: Validate Prometheus rules
      uses: prometheus-community/promtool-github-action@v2.0.0
      with:
        args: check rules prometheus/rules.yml

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD

  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: ./api
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-dashboards:
    name: Build Dashboard Images
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    strategy:
      matrix:
        dashboard: [admin, client]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.dashboard }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push ${{ matrix.dashboard }} image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.dashboard }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-dashboards]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Ansible
      run: |
        pip install ansible ansible-core
        ansible-galaxy collection install community.docker
        
    - name: Configure SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to staging environment
      run: |
        ansible-playbook \
          -i ansible/inventories/staging.ini \
          ansible/playbooks/deploy-api.yml \
          --extra-vars "docker_image_tag=sha-${{ github.sha }}"
      env:
        ANSIBLE_HOST_KEY_CHECKING: False

  deploy-edge-configs:
    name: Deploy Edge Configurations
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Ansible
      run: |
        pip install ansible ansible-core
        
    - name: Configure SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EDGE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
    - name: Get edge node inventory
      run: |
        # Fetch current edge nodes from API
        curl -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
             "${{ secrets.API_URL }}/api/auto-scale/edge-nodes" \
             | jq -r '.edge_nodes[] | "\(.ip_address) ansible_host=\(.ip_address) region=\(.region)"' \
             > ansible/inventories/edge-nodes.ini
             
    - name: Deploy Nginx configurations
      run: |
        ansible-playbook \
          -i ansible/inventories/edge-nodes.ini \
          ansible/playbooks/deploy-edge.yml \
          --limit "all" \
          --extra-vars "nginx_reload=true"
      env:
        ANSIBLE_HOST_KEY_CHECKING: False
        
    - name: Update Prometheus targets
      run: |
        python scripts/update-prometheus.py --output ansible/inventories/edge-nodes.json
        
    - name: Reload Prometheus configuration
      run: |
        curl -X POST "${{ secrets.PROMETHEUS_URL }}/-/reload" \
             -H "Authorization: Bearer ${{ secrets.PROMETHEUS_TOKEN }}"

  update-monitoring:
    name: Update Monitoring Configuration
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Update Prometheus configuration
      run: |
        # Copy updated Prometheus config
        curl -X POST "${{ secrets.PROMETHEUS_URL }}/api/v1/admin/tsdb/reload" \
             -H "Authorization: Bearer ${{ secrets.PROMETHEUS_TOKEN }}"
             
    - name: Update Grafana dashboards
      run: |
        # Update Grafana dashboard
        curl -X POST "${{ secrets.GRAFANA_URL }}/api/dashboards/db" \
             -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
             -H "Content-Type: application/json" \
             -d @grafana/dashboard.json

  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-edge-configs]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test API endpoints
      run: |
        # Test health endpoint
        curl -f "${{ secrets.STAGING_API_URL }}/health" || exit 1
        
        # Test authentication
        response=$(curl -s -X POST "${{ secrets.STAGING_API_URL }}/api/auth/login" \
                       -H "Content-Type: application/json" \
                       -d '{"email":"${{ secrets.TEST_EMAIL }}","password":"${{ secrets.TEST_PASSWORD }}"}')
        
        token=$(echo $response | jq -r '.access_token')
        
        # Test authenticated endpoint
        curl -f -H "Authorization: Bearer $token" \
             "${{ secrets.STAGING_API_URL }}/api/stats/dashboard" || exit 1
             
    - name: Test edge node connectivity
      run: |
        # Test a sample edge node
        curl -f "${{ secrets.STAGING_EDGE_URL }}/health" || exit 1
        
    - name: Test monitoring endpoints
      run: |
        # Test Prometheus
        curl -f "${{ secrets.PROMETHEUS_URL }}/api/v1/query?query=up" || exit 1
        
        # Test Grafana
        curl -f "${{ secrets.GRAFANA_URL }}/api/health" || exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [test-deployment]
    if: always()
    
    steps:
    - name: Notify Slack on success
      if: needs.test-deployment.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: ':white_check_mark: Cachenet CDN deployment to staging completed successfully!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        
    - name: Notify Slack on failure
      if: needs.test-deployment.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        text: ':x: Cachenet CDN deployment to staging failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-deployment]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Manual approval required
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.TOKEN }}
        approvers: ${{ secrets.PROD_APPROVERS }}
        minimum-approvals: 2
        
    - name: Deploy to production
      run: |
        echo "Production deployment would be triggered here"
        # Similar steps as staging but with production credentials
        
    - name: Update production monitoring
      run: |
        echo "Update production monitoring configuration"
        
    - name: Verify production deployment
      run: |
        echo "Run production health checks"

# Security and maintenance jobs
  security-updates:
    name: Security Updates Check
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 2 * * *'  # Daily at 2 AM
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for dependency updates
      run: |
        # Check Python dependencies
        pip install pip-audit
        pip-audit --desc --format=json > security-audit.json
        
    - name: Create security issue if vulnerabilities found
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Security Vulnerabilities Detected',
            body: 'Automated security scan found vulnerabilities. Please review and update dependencies.',
            labels: ['security', 'high-priority']
          })

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM
    
    steps:
    - name: Delete old container images
      uses: actions/delete-package-versions@v4
      with:
        package-name: 'cachenet-enterprise/api'
        package-type: 'container'
        min-versions-to-keep: 10
        delete-only-untagged-versions: true