[edge_nodes]
# Edge nodes will be dynamically populated by the system
# Example entries:
# edge-nyc1-001 ansible_host=192.168.1.100 ansible_user=root region=nyc1
# edge-ams3-001 ansible_host=192.168.1.101 ansible_user=root region=ams3

[new_edge_nodes]
# Temporary group for newly created nodes during deployment

[all:vars]
ansible_ssh_private_key_file=/app/ansible/keys/cachenet-ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'