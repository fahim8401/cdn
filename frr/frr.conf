# Cachenet CDN FRRouting Configuration
# Alternative BGP implementation using FRRouting

# Global configuration
hostname cachenet-edge
password zebra
enable password zebra
log file /var/log/frr/zebra.log

# BGP configuration
router bgp 65001
  bgp router-id 1.1.1.1
  
  # Anycast network announcements
  network 203.0.113.10/32
  network 203.0.113.11/32
  network 203.0.113.12/32
  network 203.0.113.13/32
  network 203.0.113.14/32
  
  # Upstream provider 1
  neighbor 192.168.1.1 remote-as 64512
  neighbor 192.168.1.1 description "Upstream Provider 1"
  neighbor 192.168.1.1 password your-bgp-password-here
  neighbor 192.168.1.1 route-map anycast-out out
  neighbor 192.168.1.1 route-map default-in in
  
  # Upstream provider 2  
  neighbor 192.168.1.2 remote-as 64513
  neighbor 192.168.1.2 description "Upstream Provider 2"
  neighbor 192.168.1.2 password your-bgp-password-here
  neighbor 192.168.1.2 route-map anycast-out out
  neighbor 192.168.1.2 route-map default-in in
  
  # Internet Exchange Point
  neighbor 198.51.100.1 remote-as 64514
  neighbor 198.51.100.1 description "Internet Exchange Point"
  neighbor 198.51.100.1 password your-ixp-password-here
  neighbor 198.51.100.1 route-map anycast-out out
  
  # Internal BGP with other edge nodes
  neighbor 10.0.1.10 remote-as 65001
  neighbor 10.0.1.10 description "Edge Node 1"
  neighbor 10.0.1.10 next-hop-self
  neighbor 10.0.1.10 route-reflector-client
  
  neighbor 10.0.1.11 remote-as 65001
  neighbor 10.0.1.11 description "Edge Node 2"
  neighbor 10.0.1.11 next-hop-self
  neighbor 10.0.1.11 route-reflector-client

# Access lists for route filtering
ip prefix-list anycast-routes seq 10 permit 203.0.113.0/28 le 32
ip prefix-list default-routes seq 10 permit 0.0.0.0/0
ip prefix-list customer-routes seq 10 permit 0.0.0.0/0 le 24

# Route maps
route-map anycast-out permit 10
  match ip address prefix-list anycast-routes
  set community 65001:100
  set local-preference 100

route-map default-in permit 10
  match ip address prefix-list default-routes
  set local-preference 50

route-map default-in permit 20
  match ip address prefix-list customer-routes
  set local-preference 100

# BGP community lists
ip community-list standard anycast-community permit 65001:100
ip community-list standard customer-community permit 65001:200

# Static routes for anycast IPs (should point to loopback)
ip route 203.0.113.10/32 lo
ip route 203.0.113.11/32 lo
ip route 203.0.113.12/32 lo
ip route 203.0.113.13/32 lo
ip route 203.0.113.14/32 lo

# Interface configuration for loopback
interface lo
  ip address 203.0.113.10/32
  ip address 203.0.113.11/32
  ip address 203.0.113.12/32
  ip address 203.0.113.13/32
  ip address 203.0.113.14/32

# Logging
log syslog informational