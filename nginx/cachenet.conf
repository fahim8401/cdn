# Cachenet CDN Nginx Configuration
# Production-ready caching and reverse proxy configuration

# Cache path configuration
proxy_cache_path /var/cache/nginx/cachenet levels=1:2 keys_zone=cachenet:100m max_size=10g inactive=7d use_temp_path=off;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=purge:10m rate=1r/s;

# Upstream servers
upstream api_backend {
    server api:5000;
    keepalive 32;
}

upstream admin_backend {
    server admin:3000;
    keepalive 16;
}

upstream client_backend {
    server client:3000;
    keepalive 16;
}

upstream grafana_backend {
    server grafana:3000;
    keepalive 8;
}

# Main server block for API
server {
    listen 80;
    server_name api.cachenet.local;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    
    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    
    # API routes
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Health check
    location /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }
    
    # Cache purge endpoint (restricted)
    location /purge {
        limit_req zone=purge burst=5 nodelay;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://api_backend/api/cache/purge/by-key;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Admin dashboard
server {
    listen 80;
    server_name admin.cachenet.local;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://api.cachenet.local;";
    
    location / {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Client dashboard
server {
    listen 80;
    server_name client.cachenet.local;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://api.cachenet.local;";
    
    location / {
        proxy_pass http://client_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Grafana monitoring
server {
    listen 80;
    server_name monitoring.cachenet.local;
    
    # Basic auth for additional security
    auth_basic "Cachenet Monitoring";
    auth_basic_user_file /etc/nginx/htpasswd;
    
    location / {
        proxy_pass http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# CDN Edge Server Template (to be deployed on edge nodes)
# This configuration should be deployed via Ansible
server {
    listen 80 default_server;
    server_name _;
    
    # Logging
    access_log /var/log/nginx/cachenet-access.log combined;
    error_log /var/log/nginx/cachenet-error.log warn;
    
    # Security headers
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Edge-Server $hostname;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Cache configuration
    proxy_cache cachenet;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    
    # Cache key
    proxy_cache_key "$scheme$request_method$host$request_uri";
    
    # Default cache settings
    proxy_cache_valid 200 206 1h;
    proxy_cache_valid 301 302 10m;
    proxy_cache_valid 404 1m;
    proxy_cache_valid any 5m;
    
    # Static assets with long cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip|tar|bz2|gz|rar|7z)$ {
        proxy_pass $origin_server;
        proxy_cache_valid 200 206 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Edge-Server $hostname;
    }
    
    # HTML pages with shorter cache
    location ~* \.(html|htm)$ {
        proxy_pass $origin_server;
        proxy_cache_valid 200 206 1h;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Edge-Server $hostname;
    }
    
    # API endpoints - cache for short time
    location ~* /api/ {
        proxy_pass $origin_server;
        proxy_cache_valid 200 206 5m;
        expires 5m;
        add_header Cache-Control "public";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Edge-Server $hostname;
    }
    
    # Dynamic content - minimal cache
    location / {
        proxy_pass $origin_server;
        proxy_cache_valid 200 206 10m;
        expires 10m;
        add_header Cache-Control "public";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Edge-Server $hostname;
        
        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Cache purge endpoint (for plugins)
    location /purge {
        limit_req zone=purge burst=5 nodelay;
        
        # Allow only POST requests
        if ($request_method != POST) {
            return 405;
        }
        
        # Purge cache for specific URL
        proxy_cache_purge cachenet "$scheme$request_method$host$request_uri";
        return 200 "Cache purged for $host$request_uri\n";
    }
    
    # Health check for load balancer
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

