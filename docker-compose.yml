version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: xencdn-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xencdn-net

  # Redis for Caching and Celery
  redis:
    image: redis:7-alpine
    container_name: xencdn-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xencdn-net

  # PowerDNS Authoritative Server for DNS Management
  powerdns:
    image: powerdns/pdns-auth-49:latest
    container_name: xencdn-powerdns
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY}
      PDNS_AUTH_WEBSERVER: "yes"
      PDNS_AUTH_WEBSERVER_ADDRESS: "0.0.0.0"
      PDNS_AUTH_WEBSERVER_PORT: "8081"
      PDNS_AUTH_WEBSERVER_ALLOW_FROM: "0.0.0.0/0"
      PDNS_AUTH_API: "yes"
      PDNS_AUTH_LAUNCH: "gpgsql"
      PDNS_AUTH_GPGSQL_HOST: "db"
      PDNS_AUTH_GPGSQL_PORT: "5432"
      PDNS_AUTH_GPGSQL_DBNAME: ${POSTGRES_DB}
      PDNS_AUTH_GPGSQL_USER: ${POSTGRES_USER}
      PDNS_AUTH_GPGSQL_PASSWORD: ${POSTGRES_PASSWORD}
      PDNS_AUTH_DEFAULT_SOA_NAME: ${DNS_SERVER_NAME}
      PDNS_AUTH_DEFAULT_SOA_MAIL: "hostmaster.${HOMEPAGE_DOMAIN}"
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xencdn-net

  # MinIO for SSL Certificate and Config Storage
  minio:
    image: minio/minio:latest
    container_name: xencdn-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - xencdn-net

  # ACME.sh for SSL Certificate Management
  acme:
    image: neilpang/acme.sh:latest
    container_name: xencdn-acme
    environment:
      PDNS_Url: ${PDNS_API_URL}
      PDNS_ServerId: "localhost"
      PDNS_Token: ${PDNS_API_KEY}
      PDNS_Ttl: "60"
    volumes:
      - ./certbot:/acme.sh
      - /etc/localtime:/etc/localtime:ro
    command: daemon
    restart: unless-stopped
    depends_on:
      - powerdns
    networks:
      - xencdn-net

  # Bird2 BGP Daemon (for BGP Anycast mode)
  bird:
    image: bird:latest
    container_name: xencdn-bird
    privileged: true
    network_mode: host
    environment:
      BGP_ASN: ${BGP_ASN}
      ANYCAST_IP: ${BGP_IP_BLOCK}
      PEER_IP: ${BGP_PEER_IP}
    volumes:
      - ./bird:/etc/bird
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    profiles:
      - bgp  # Only start when BGP mode is enabled

  # FRRouting (alternative to Bird2)
  frr:
    image: frrouting/frr:latest
    container_name: xencdn-frr
    privileged: true
    network_mode: host
    environment:
      BGP_ASN: ${BGP_ASN}
      ANYCAST_IP: ${BGP_IP_BLOCK}
      PEER_IP: ${BGP_PEER_IP}
    volumes:
      - ./frr:/etc/frr
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    profiles:
      - frr  # Alternative BGP implementation

  # XenCDN API Backend
  api:
    build: ./api
    container_name: xencdn-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PDNS_API_KEY: ${PDNS_API_KEY}
      PDNS_API_URL: ${PDNS_API_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DNS_SERVER_NAME: ${DNS_SERVER_NAME}
      DNS_SERVER_NAME2: ${DNS_SERVER_NAME2}
      BGP_ASN: ${BGP_ASN}
      BGP_IP_BLOCK: ${BGP_IP_BLOCK}
      EDGE_MODE: ${EDGE_MODE}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FERNET_KEY: ${FERNET_KEY}
    volumes:
      - ./api:/app
      - ./ansible:/app/ansible
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      powerdns:
        condition: service_started
    restart: unless-stopped
    networks:
      - xencdn-net

  # Celery Worker for Background Tasks
  celery-worker:
    build: ./api
    container_name: xencdn-celery-worker
    command: celery -A celery_config.celery worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PDNS_API_KEY: ${PDNS_API_KEY}
      PDNS_API_URL: ${PDNS_API_URL}
      DNS_SERVER_NAME: ${DNS_SERVER_NAME}
      DNS_SERVER_NAME2: ${DNS_SERVER_NAME2}
      BGP_ASN: ${BGP_ASN}
      EDGE_MODE: ${EDGE_MODE}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FERNET_KEY: ${FERNET_KEY}
    volumes:
      - ./api:/app
      - ./ansible:/app/ansible
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks:
      - xencdn-net

  # Celery Beat for Scheduled Tasks
  celery-beat:
    build: ./api
    container_name: xencdn-celery-beat
    command: celery -A celery_config.celery beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - ./api:/app
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks:
      - xencdn-net

  # Admin Dashboard (React/Vite)
  admin:
    build: 
      context: ./admin
      dockerfile: Dockerfile
    container_name: xencdn-admin
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_PLATFORM_NAME: "XenCDN v8.2"
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - xencdn-net

  # Client Portal (React/Vite)
  client-portal:
    build:
      context: ./client-portal
      dockerfile: Dockerfile
    container_name: xencdn-client-portal
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_PLATFORM_NAME: "XenCDN Client Portal"
      VITE_DNS_SERVER_NAME: ${DNS_SERVER_NAME}
      VITE_DNS_SERVER_NAME2: ${DNS_SERVER_NAME2}
    volumes:
      - ./client-portal:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - xencdn-net

  # ISP Portal (React/Vite)
  isp-portal:
    build:
      context: ./isp-portal
      dockerfile: Dockerfile
    container_name: xencdn-isp-portal
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_PLATFORM_NAME: "XenCDN ISP Portal"
      VITE_BGP_ASN: ${BGP_ASN}
    volumes:
      - ./isp-portal:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3003:3000"
    restart: unless-stopped
    networks:
      - xencdn-net

  # Homepage (Static/React)
  homepage:
    build:
      context: ./homepage
      dockerfile: Dockerfile
    container_name: xencdn-homepage
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_CLIENT_PORTAL_URL: http://localhost:3002
      VITE_ISP_PORTAL_URL: http://localhost:3003
      VITE_SPEED_TEST_URL: http://localhost:3004
    volumes:
      - ./homepage:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - xencdn-net

  # Speed Test Tool (React)
  speed-test:
    build:
      context: ./speed-test
      dockerfile: Dockerfile
    container_name: xencdn-speed-test
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_PLATFORM_NAME: "XenCDN Speed Test"
    volumes:
      - ./speed-test:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3004:3000"
    restart: unless-stopped
    networks:
      - xencdn-net

  # Nginx Reverse Proxy and CDN Edge
  nginx:
    image: nginx:1.27-alpine
    container_name: xencdn-nginx
    volumes:
      - ./nginx/xencdn.conf:/etc/nginx/conf.d/default.conf
      - ./certbot:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - admin
      - client-portal
      - isp-portal
      - homepage
      - speed-test
    restart: unless-stopped
    networks:
      - xencdn-net

  # Watchtower for automatic updates (optional)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: xencdn-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 86400  # Check once per day
      WATCHTOWER_INCLUDE_STOPPED: "true"
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - xencdn-net

volumes:
  db_data:
  redis_data:
  minio_data:

networks:
  xencdn-net:
    name: xencdn-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16