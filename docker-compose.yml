version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cachenet-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and Celery
  redis:
    image: redis:7-alpine
    container_name: cachenet-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PowerDNS Authoritative Server
  powerdns:
    image: powerdns/pdns-auth-48:latest
    container_name: cachenet-powerdns
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY}
      PDNS_AUTH_WEBSERVER: "yes"
      PDNS_AUTH_WEBSERVER_ADDRESS: "0.0.0.0"
      PDNS_AUTH_WEBSERVER_PORT: "8081"
      PDNS_AUTH_WEBSERVER_ALLOW_FROM: "0.0.0.0/0"
      PDNS_AUTH_API: "yes"
      PDNS_AUTH_LAUNCH: "gpgsql"
      PDNS_AUTH_GPGSQL_HOST: "db"
      PDNS_AUTH_GPGSQL_PORT: "5432"
      PDNS_AUTH_GPGSQL_DBNAME: ${POSTGRES_DB}
      PDNS_AUTH_GPGSQL_USER: ${POSTGRES_USER}
      PDNS_AUTH_GPGSQL_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # MinIO for SSL Certificate Storage
  minio:
    image: minio/minio:latest
    container_name: cachenet-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ACME.sh for SSL Certificate Management
  acme:
    image: neilpang/acme.sh:latest
    container_name: cachenet-acme
    environment:
      PDNS_Url: ${PDNS_API_URL}
      PDNS_ServerId: "localhost"
      PDNS_Token: ${PDNS_API_KEY}
      PDNS_Ttl: "60"
    volumes:
      - ./certbot:/acme.sh
      - /etc/localtime:/etc/localtime:ro
    command: daemon
    restart: unless-stopped
    depends_on:
      - powerdns

  # Flask API Backend
  api:
    build: ./api
    container_name: cachenet-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PDNS_API_KEY: ${PDNS_API_KEY}
      PDNS_API_URL: ${PDNS_API_URL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./api:/app
      - ./ansible:/app/ansible
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker for Background Tasks
  celery-worker:
    build: ./api
    container_name: cachenet-celery-worker
    command: celery -A celery_config.celery worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PDNS_API_KEY: ${PDNS_API_KEY}
      PDNS_API_URL: ${PDNS_API_URL}
      DIGITALOCEAN_API_TOKEN: ${DIGITALOCEAN_API_TOKEN}
      LINODE_API_TOKEN: ${LINODE_API_TOKEN}
      VULTR_API_KEY: ${VULTR_API_KEY}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN}
    volumes:
      - ./api:/app
      - ./ansible:/app/ansible
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - api
      - redis
    restart: unless-stopped

  # Celery Beat for Scheduled Tasks
  celery-beat:
    build: ./api
    container_name: cachenet-celery-beat
    command: celery -A celery_config.celery beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    volumes:
      - ./api:/app
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - api
      - redis
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: cachenet-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: cachenet-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: "grafana-worldmap-panel,grafana-piechart-panel"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/cachenet.json
      - ./grafana/provisioning:/etc/grafana/provisioning
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Admin Dashboard (React)
  admin:
    build: 
      context: ./admin
      dockerfile: Dockerfile
    container_name: cachenet-admin
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_GRAFANA_URL: http://localhost:3001
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Client Dashboard (React)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cachenet-client
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3002:3000"
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cachenet-nginx
    volumes:
      - ./nginx/cachenet.conf:/etc/nginx/conf.d/default.conf
      - ./certbot:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - admin
      - client
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: cachenet
    driver: bridge