# Cachenet CDN Bird BGP Configuration
# BGP configuration for anycast IP announcements

# Router ID - should be unique for each bird instance
router id 1.1.1.1;

# Configure synchronization between BIRD and kernel routing table
protocol kernel {
    learn;                  # Learn all alien routes from the kernel
    persist;                # Don't remove routes on bird shutdown
    scan time 20;           # Scan kernel routing table every 20 seconds
    import none;            # Default is import all
    export all;             # Default is export none
}

# The Device protocol is not a real routing protocol. It doesn't generate any
# routes and it only serves as a module for getting information about network
# interfaces from the kernel.
protocol device {
    scan time 10;           # Scan interfaces every 10 seconds
}

# Static routes for anycast IPs
protocol static static_anycast {
    # Anycast IP for CDN (should be assigned to loopback)
    route 203.0.113.10/32 via "lo";
    route 203.0.113.11/32 via "lo";
    route 203.0.113.12/32 via "lo";
    route 203.0.113.13/32 via "lo";
    route 203.0.113.14/32 via "lo";
}

# BGP template for upstream providers
template bgp bgp_upstream {
    local as 65001;
    import filter {
        # Accept default route and more specific routes
        if net = 0.0.0.0/0 then accept;
        if net.len > 24 then reject;
        accept;
    };
    export filter {
        # Only export our anycast routes
        if net ~ [203.0.113.0/28] then accept;
        reject;
    };
    next hop self;
    add paths on;
}

# BGP sessions with upstream providers
# Replace with actual upstream provider details
protocol bgp upstream1 from bgp_upstream {
    neighbor 192.168.1.1 as 64512;
    description "Upstream Provider 1";
    password "your-bgp-password-here";
}

protocol bgp upstream2 from bgp_upstream {
    neighbor 192.168.1.2 as 64513;
    description "Upstream Provider 2";
    password "your-bgp-password-here";
}

# Internet Exchange Point sessions
protocol bgp ixp1 from bgp_upstream {
    neighbor 198.51.100.1 as 64514;
    description "Internet Exchange Point 1";
    password "your-ixp-password-here";
}

# Internal BGP for edge nodes coordination
template bgp ibgp_template {
    local as 65001;
    import all;
    export all;
    next hop self;
    rr client;
}

# Route reflector configuration
protocol bgp rr_client1 from ibgp_template {
    neighbor 10.0.1.10 as 65001;
    description "Edge Node 1";
}

protocol bgp rr_client2 from ibgp_template {
    neighbor 10.0.1.11 as 65001;
    description "Edge Node 2";
}

# Route filters
filter export_anycast {
    if net ~ [203.0.113.0/28] then {
        # Set BGP community for anycast routes
        bgp_community.add((65001, 100));
        accept;
    }
    reject;
}

filter import_defaults {
    if net = 0.0.0.0/0 then accept;
    if net.len > 24 then reject;
    accept;
}

# BGP communities
# 65001:100 - Anycast routes
# 65001:200 - Customer routes
# 65001:300 - Infrastructure routes